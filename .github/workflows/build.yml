name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build
        shell: bash
        run: gradle assembleDebug --stacktrace --console=plain 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Report errors
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -E "^e: |error:|What went wrong|FAILED|Caused by" -A2 build.log | head -n 70 > err.txt || true
          [ -s err.txt ] || tail -n 40 build.log > err.txt
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -f body="$(cat err.txt)"
      - uses: actions/upload-artifact@v4
        with:
          name: VoiceRec-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK in Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk VoiceRec.apk
          gh release create "apk-${{ github.run_number }}" VoiceRec.apk --title "VoiceRec APK ${{ github.run_number }}" --notes "APK installabile"
